name: Dreamcrafters Social Media Bot

on:
  schedule:
    # Se ejecuta en el minuto 0 de cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  publish_posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar el Vigilante
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
        run: node instagram_worker.js

      - name: Guardar cambios si hubo publicaciones
        # Si el vigilante publicó algo, el archivo JSON cambiará a "published".
        # Este paso vuelve a subir (commit) el archivo modificado a GitHub.
        run: |
          git config --global user.name "Dreamcrafters Bot"
          git config --global user.email "bot@dreamcrafters.lat"
          git add instagram_queue.json
          git diff --staged --quiet || (git commit -m "🤖 Auto-update: Posts publicados" && git push)
